<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efece3">
<title>感染性廃棄物クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{
  --ink:#3d3a36; --paper:#efece3; --card:#fffdf8; --line:#e3ddcd; --sub:#8a8577;
  --shadow:#ddd6c2;
  --ok:#3e9b6c; --okbg:#e6f3ea; --ng:#d94a3a; --ngbg:#fbe9e5;
  --chip:#fdf3d5;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.6;
}
#app{max-width:430px;margin:0 auto;padding:14px 14px 48px;min-height:100dvh}
.scr{display:none}
.scr.active{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scr.active{animation:none}}

/* ---------- 共通部品 ---------- */
button{font:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #4a7fd4;outline-offset:2px}
.btn{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:2.5px solid var(--ink);border-radius:16px;
  padding:12px 14px;font-weight:700;font-size:15.5px;
  box-shadow:0 3px 0 var(--shadow);
}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn .ic{
  flex:0 0 42px;width:42px;height:42px;border-radius:13px;border:2.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;
}
.btn .bd{flex:1}
.btn small{display:block;font-size:11.5px;font-weight:500;color:var(--sub);line-height:1.4}
.ghost{
  background:none;border:none;box-shadow:none;font-weight:700;font-size:14px;
  color:var(--sub);padding:8px 10px;border-radius:10px;
}
.ghost:active{background:#e6e1d2}
.primary{
  display:block;width:100%;background:var(--ink);color:#fffdf8;border:2.5px solid var(--ink);
  border-radius:14px;padding:12px;font-weight:800;font-size:15.5px;box-shadow:0 3px 0 var(--shadow);
}
.primary:active{transform:translateY(2px);box-shadow:none}
.stack{display:flex;flex-direction:column;gap:11px}

/* ---------- ホーム ---------- */
.hero{text-align:center;padding:20px 0 14px}
.hero .binrow{display:flex;justify-content:center;gap:2px;margin-bottom:6px}
.hero .binrow svg{width:52px;height:52px}
.hero h1{font-size:25px;font-weight:800;margin:0;letter-spacing:.02em}
.hero .tagline{
  display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:#6b6152;
  background:var(--chip);border-radius:10px;padding:3px 12px;
}
.homefoot{margin-top:26px;font-size:10.5px;color:var(--sub);text-align:center;line-height:1.7}

/* ---------- クイズ ---------- */
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qhead .mode{font-weight:800;font-size:14px}
.qhead .spacer{flex:1}
.qhead .score{font-weight:800;font-size:14px;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:2px 10px}
.track{height:10px;background:#e3ddcd;border-radius:6px;overflow:hidden;margin-bottom:12px}
.track .fill{height:100%;width:0%;background:var(--ok);border-radius:6px;transition:width .25s}
.track .fill.time{background:var(--ng);transition:width .1s linear}
.qcard{
  position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:20px;
  padding:16px 14px 14px;text-align:center;box-shadow:0 4px 0 var(--shadow);
}
.qcard .lead{font-size:12px;font-weight:700;color:var(--sub);margin:0}
.iconwrap{position:relative;display:inline-block;width:92px;height:92px;margin-top:2px}
.iconwrap svg.main{width:92px;height:92px}
.iconwrap .drop{position:absolute;top:-2px;right:-10px;width:26px;height:26px;display:none}
.qname{font-size:21px;font-weight:800;margin:2px 0 6px;line-height:1.35}
.qsitu{
  display:inline-block;background:var(--chip);border-radius:10px;padding:4px 12px;
  font-size:13.5px;font-weight:700;color:#6b6152;line-height:1.5;
}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.binbtn{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:var(--card);border:2.5px solid var(--ink);border-radius:14px;
  padding:7px 4px 6px;font-weight:700;font-size:12.5px;line-height:1.3;
  box-shadow:0 3px 0 var(--shadow);
}
.binbtn:active{transform:translateY(2px);box-shadow:none}
.binbtn svg{width:50px;height:50px}
.binbtn small{font-size:9.5px;font-weight:500;color:var(--sub)}
.binbtn.wide{grid-column:1/-1;width:calc(50% - 4.5px);margin:0 auto}
.bins.lock .binbtn{pointer-events:none;opacity:.45}
.bins.lock .binbtn.right{opacity:1;border-color:var(--ok);background:var(--okbg)}
.bins.lock .binbtn.picked-wrong{opacity:1;border-color:var(--ng);background:var(--ngbg)}
.fb{border-radius:16px;padding:12px 13px;margin-top:12px;border:2.5px solid;text-align:left}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.ng{background:var(--ngbg);border-color:var(--ng)}
.fb .verdict{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin-bottom:4px}
.fb.ok .verdict{color:var(--ok)}
.fb.ng .verdict{color:var(--ng)}
.fb .mark{font-size:22px}
.fb .correct{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;margin:4px 0}
.fb .correct svg{width:34px;height:34px}
.fb .expl{font-size:13.5px;line-height:1.7;margin:4px 0 10px}
.toast{
  text-align:center;font-weight:800;font-size:15px;border-radius:12px;
  padding:7px;margin-top:12px;display:none;
}
.toast.ok{display:block;background:var(--okbg);color:var(--ok)}
.toast.ng{display:block;background:var(--ngbg);color:var(--ng)}

/* ---------- 結果 ---------- */
.resulthead{text-align:center;padding:14px 0 6px}
.stamp{
  display:inline-block;font-size:26px;font-weight:800;padding:8px 26px;border-radius:14px;
  border:3.5px solid;transform:rotate(-4deg);margin-bottom:10px;
}
.stamp.good{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.stamp.bad{color:var(--ng);border-color:var(--ng);background:var(--ngbg)}
.bigscore{font-size:40px;font-weight:800;line-height:1.2}
.bigscore small{font-size:16px}
.submsg{font-size:13.5px;font-weight:700;color:var(--sub)}
.wronghead{font-size:14px;font-weight:800;margin:18px 0 8px}
.wrongitem{
  background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:10px 12px;margin-bottom:9px;font-size:13px;line-height:1.65;
}
.wrongitem .t{font-weight:800;font-size:14px}
.wrongitem .a{font-weight:800;color:var(--ok)}

/* ---------- 図鑑 ---------- */
.zcard{
  display:flex;gap:12px;background:var(--card);border:2.5px solid var(--ink);
  border-radius:18px;padding:13px;margin-bottom:11px;box-shadow:0 3px 0 var(--shadow);
}
.zcard svg{flex:0 0 76px;width:76px;height:76px}
.zcard h3{margin:0 0 2px;font-size:15.5px}
.zcard .zin{margin:0;padding-left:18px;font-size:12.5px;line-height:1.7}
.zcard .warn{margin:5px 0 0;font-size:12px;font-weight:700;color:var(--ng);line-height:1.6}
.pagehead{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.pagehead h2{font-size:18px;margin:0;flex:1}
</style>
</head>

const $ = id => document.getElementById(id);

/* ---------- ストレージ ---------- */
const store = {
  data: { wrong: {}, bestTA: 0 },
  load(){ try{ const raw = localStorage.getItem("wasteQuiz.v1"); if(raw) this.data = Object.assign(this.data, JSON.parse(raw)); }catch(e){} },
  save(){ try{ localStorage.setItem("wasteQuiz.v1", JSON.stringify(this.data)); }catch(e){} },
  addWrong(id){ this.data.wrong[id] = (this.data.wrong[id]||0)+1; this.save(); },
  clearWrong(id){ if(this.data.wrong[id]){ delete this.data.wrong[id]; this.save(); } },
  weakIds(){ return Object.keys(this.data.wrong); }
};
store.load();

/* ---------- 画面切替 ---------- */
function show(id){
  document.querySelectorAll(".scr").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0,0);
}
function goHome(){
  stopTimer();
  $("ta-best").textContent = store.data.bestTA;
  const n = store.weakIds().length;
  $("weak-count").textContent = n;
  $("btn-weak").hidden = n === 0;
  show("scr-home");
}
document.querySelectorAll("[data-home]").forEach(b=>b.addEventListener("click", goHome));

/* ---------- 出題状態 ---------- */
const TA_SECONDS = 60;
let st = null;   // {mode, pool, i, score, wrongs, answered, left, tick}
let timer = null;

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }

function start(mode, pool, label){
  st = { mode, pool, i:0, score:0, wrongs:[], answered:false, label };
  if(mode==="ta"){
    st.left = TA_SECONDS*10;
    $("q-fill").className = "fill time";
    timer = setInterval(()=>{
      st.left--;
      $("q-fill").style.width = (st.left/(TA_SECONDS*10)*100)+"%";
      $("q-mode").textContent = "残り " + Math.ceil(st.left/10) + "秒";
      if(st.left<=0){ stopTimer(); finish(); }
    },100);
  } else {
    $("q-fill").className = "fill";
  }
  show("scr-quiz");
  renderQ();
}

function q(){ return st.pool[st.i]; }

function renderQ(){
  st.answered = false;
  const c = q();
  $("q-no").textContent = st.mode==="ta" ? "どんどん答えよう!" : `第${st.i+1}問 / ${st.pool.length}`;
  $("q-mode").textContent = st.mode==="ta" ? ("残り "+Math.ceil(st.left/10)+"秒") : st.label;
  $("q-score").textContent = "○ " + st.score;
  if(st.mode!=="ta") $("q-fill").style.width = (st.i/st.pool.length*100)+"%";
  const sym = c.icon.startsWith("bin-") ? c.icon : "item-"+c.icon;
  $("q-icon").setAttribute("href", "#"+sym);
  $("q-drop").style.display = c.blood ? "block" : "none";
  $("q-name").textContent = c.item;
  $("q-situ").textContent = c.situ;
  $("fb").hidden = true;
  $("toast").className = "toast";
  renderBins();
}

function renderBins(){
  const wrap = $("bins");
  wrap.className = "bins";
  wrap.innerHTML = "";
  BIN_ORDER.forEach((id, idx)=>{
    const b = BINS[id];
    const btn = document.createElement("button");
    btn.className = "binbtn" + (idx===BIN_ORDER.length-1 ? " wide" : "");
    btn.dataset.bin = id;
    btn.innerHTML = `<svg aria-hidden="true"><use href="#${b.sym}"/></svg>${b.name}<small>${b.sub}</small>`;
    btn.addEventListener("click", ()=>answer(id, btn));
    wrap.appendChild(btn);
  });
}

function answer(binId, btn){
  if(st.answered) return;
  st.answered = true;
  const c = q();
  const ok = binId === c.ans;
  const wrap = $("bins");
  wrap.classList.add("lock");
  wrap.querySelectorAll(".binbtn").forEach(el=>{
    if(el.dataset.bin===c.ans) el.classList.add("right");
    else if(el===btn) el.classList.add("picked-wrong");
  });
  if(ok){
    st.score++;
    if(st.mode==="weak") store.clearWrong(c.id);
  } else {
    st.wrongs.push(c);
    if(st.mode!=="weak") store.addWrong(c.id);
  }
  $("q-score").textContent = "○ " + st.score;

  if(st.mode==="ta"){
    const t = $("toast");
    t.textContent = ok ? "○ 正解!" : "× " + BINS[c.ans].name + " でした";
    t.className = "toast " + (ok?"ok":"ng");
    setTimeout(()=>{ if(st && st.mode==="ta" && st.left>0){ nextQ(); } }, ok?550:1400);
  } else {
    const fb = $("fb");
    fb.className = "fb " + (ok?"ok":"ng");
    $("fb-mark").textContent = ok ? "○" : "×";
    $("fb-word").textContent = ok ? "正解!" : "残念…";
    $("fb-correct").innerHTML = ok ? "" :
      `<svg aria-hidden="true"><use href="#${BINS[c.ans].sym}"/></svg><span>正解は「${BINS[c.ans].name}」</span>`;
    $("fb-expl").textContent = c.expl;
    $("btn-next").textContent = (st.i+1 >= st.pool.length) ? "結果を見る" : "次へ";
    fb.hidden = false;
    fb.scrollIntoView({behavior:"smooth", block:"nearest"});
  }
}

function nextQ(){
  st.i++;
  if(st.mode==="ta"){
    if(st.i >= st.pool.length){ st.pool = shuffle(QUESTIONS); st.i = 0; }
    renderQ();
    return;
  }
  if(st.i >= st.pool.length){ finish(); } else { renderQ(); }
}
$("btn-next").addEventListener("click", nextQ);

/* ---------- 結果 ---------- */
function finish(){
  stopTimer();
  const head = $("result-head");
  const total = st.mode==="ta" ? st.score + st.wrongs.length : st.pool.length;
  let html = "";
  if(st.mode==="test"){
    const pass = st.score >= 8;
    html += `<div><span class="stamp ${pass?"good":"bad"}">${pass?"合格!":"もう一歩"}</span></div>`;
    html += `<div class="bigscore">${st.score}<small> / ${st.pool.length} 問</small></div>`;
    html += `<div class="submsg">${pass?"すばらしい! 分別マスターです":"解説を読んでもう一回チャレンジ!"}</div>`;
  } else if(st.mode==="ta"){
    let best = "";
    if(st.score > store.data.bestTA){ store.data.bestTA = st.score; store.save(); best = " ベスト更新!"; }
    html += `<div class="bigscore">${st.score}<small> 問正解</small></div>`;
    html += `<div class="submsg">60秒 ・ ${total}問中${best}</div>`;
  } else {
    const rate = total ? Math.round(st.score/total*100) : 0;
    html += `<div class="bigscore">${st.score}<small> / ${total} 問 (${rate}%)</small></div>`;
    html += `<div class="submsg">${rate===100?"パーフェクト!":"間違えた問題は下で復習しよう"}</div>`;
  }
  head.innerHTML = html;

  const w = $("result-wrongs");
  if(st.wrongs.length){
    let list = `<div class="wronghead">間違えた問題 (${st.wrongs.length})</div>`;
    st.wrongs.forEach(c=>{
      list += `<div class="wrongitem"><span class="t">${c.item}</span> <span style="color:var(--sub)">(${c.situ})</span><br>` +
              `→ <span class="a">${BINS[c.ans].name}</span><br>${c.expl}</div>`;
    });
    w.innerHTML = list;
  } else {
    w.innerHTML = "";
  }
  show("scr-result");
}
$("btn-retry").addEventListener("click", ()=>{
  if(st.mode==="practice") start("practice", shuffle(st.rawPool||st.pool), st.label);
  else if(st.mode==="test") startTest();
  else if(st.mode==="ta") startTA();
  else startWeak();
});

/* ---------- モード開始 ---------- */
function startTest(){ start("test", shuffle(QUESTIONS).slice(0,10), "テスト"); }
function startTA(){ start("ta", shuffle(QUESTIONS), "タイムアタック"); }
function startWeak(){
  const ids = store.weakIds();
  const pool = QUESTIONS.filter(c=>ids.includes(String(c.id)));
  if(!pool.length){ goHome(); return; }
  start("weak", shuffle(pool), "苦手復習");
}
$("btn-test").addEventListener("click", startTest);
$("btn-ta").addEventListener("click", startTA);
$("btn-weak").addEventListener("click", startWeak);
$("btn-zukan").addEventListener("click", ()=>{ renderZukan(); show("scr-zukan"); });

$("btn-practice").addEventListener("click", ()=>{
  const list = $("catlist");
  list.innerHTML = "";
  CATS.forEach(cat=>{
    const pool = cat.key==="all" ? QUESTIONS : QUESTIONS.filter(c=>c.cat===cat.key);
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.innerHTML = `<span class="ic" style="background:${cat.color}">${cat.mark}</span>` +
                    `<span class="bd">${cat.name}<small>${cat.desc} ・ ${pool.length}問</small></span>`;
    btn.addEventListener("click", ()=>{
      const p = shuffle(pool);
      start("practice", p, cat.name);
      st.rawPool = pool;
    });
    list.appendChild(btn);
  });
  show("scr-cats");
});

/* ---------- 図鑑 ---------- */
function renderZukan(){
  const wrap = $("zukanlist");
  wrap.innerHTML = "";
  ZUKAN.forEach(z=>{
    const b = BINS[z.bin];
    const el = document.createElement("div");
    el.className = "zcard";
    el.innerHTML = `<svg aria-hidden="true"><use href="#${b.sym}"/></svg>` +
      `<div><h3>${b.name}</h3>` +
      `<ul class="zin">${z.items.map(t=>`<li>${t}</li>`).join("")}</ul>` +
      (z.warn ? `<p class="warn">⚠ ${z.warn}</p>` : "") +
      `</div>`;
    wrap.appendChild(el);
  });
}

goHome();
</script>
</body>
</html>
